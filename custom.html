<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css?family=Roboto+Mono|Source+Sans+Pro:300,400,600" rel="stylesheet">
<meta name='zd-site-verification' content='xj9koofr1crilmoclgxsjd' />

<script type="text/javascript">


    function setActiveClassForCurrentUrl() {
        // Find all links in the navbarCollapse div where the href attribute is set to the current URL
        let anchorTag = document.querySelector('#navbarCollapse a[href="' + window.location.href + '"]');

        if (anchorTag) {

            // Find the closest parent of the navigation
            let parentUl = anchorTag.closest('li.nav-item')?.querySelector('a.nav-link');

            if (parentUl) {
                // Add active class to both the anchor tag and the parent ul
                anchorTag.classList.add('active');
                parentUl.classList.add('active');
            }
        }
    }

    window.addEventListener('popstate', setActiveClassForCurrentUrl);
    window.addEventListener('hashchange', setActiveClassForCurrentUrl);

    document.addEventListener("DOMContentLoaded", async function () {
        const items = Array.from(document.querySelectorAll(".tag-filter-item"));
        const filterUi = document.querySelector(".tag-filter-ui");
        if (items.length === 0 || !filterUi) return;
        const staticBadges = Array.from(document.querySelectorAll(".tag-filter-badge"));
        const hasLiveProcesses = items.some((item) => item.hasAttribute("data-process"));
        let support = null;
        if (hasLiveProcesses) {
            try {
                const url = new URL("../../_data/backend_process_support.json", window.location.href);
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                support = await response.json();
            } catch (error) { console.warn("Could not load backend process support data.", error); }
        }
        const getExplicitTags = (item) => new Set((item.getAttribute("data-tags") || "").toLowerCase().split(/\s+/).filter(Boolean));
        const getDefaultTags = () => new Set(staticBadges.map((badge) => badge.dataset.tag).filter(Boolean));
        const getTags = (item) => {
            const explicitTags = getExplicitTags(item);
            if (support && item.hasAttribute("data-process")) {
                const liveTags = new Set(item.getAttribute("data-process").split(/[\s,]+/).flatMap((id) => support.processes[id] || []));
                return liveTags.size > 0 ? liveTags : explicitTags.size > 0 ? explicitTags : getDefaultTags();
            }
            return explicitTags.size > 0 ? explicitTags : getDefaultTags();
        };
        let badges = staticBadges;
        if (support) {
            const availableTags = [...new Set(items.flatMap((item) => [...getTags(item)]))].sort();
            filterUi.replaceChildren();
            badges = availableTags.map((tag) => {
                const button = document.createElement("button");
                button.className = "tag-filter-badge active";
                button.dataset.tag = tag;
                button.textContent = support.backends[tag]?.label || tag;
                filterUi.appendChild(button);
                return button;
            });
        }
        if (badges.length === 0) return;
        const tocLinks = Array.from(document.querySelectorAll("#TOC a[data-scroll-target]"));
        const applyFilter = () => {
            const selectedTags = new Set(badges.filter((badge) => badge.classList.contains("active")).map((badge) => badge.dataset.tag));
            items.forEach((item) => {
                const tags = getTags(item);
                const visible = [...selectedTags].some((tag) => tags.has(tag));
                item.hidden = !visible;
                const tocLink = tocLinks.find((link) => link.dataset.scrollTarget === `#${item.id}`);
                tocLink?.closest("li")?.toggleAttribute("hidden", !visible);
            });
        };
        badges.forEach((badge) => badge.addEventListener("click", function (event) {
            event.preventDefault(); this.classList.toggle("active"); this.classList.toggle("inactive"); applyFilter();
        }));
        applyFilter();
    });
    window.onload = () => {
        const brand = document.querySelector('.navbar-brand');
        if (brand) {
            // Keep local/preview behavior, but use the GitHub Pages project root in production.
            const brandHref = window.location.hostname === 'open-eo.github.io'
                ? '/openeo-docs/'
                : '/index.html';
            brand.setAttribute('href', brandHref);
        }
        setActiveClassForCurrentUrl();
    }

 
</script>
