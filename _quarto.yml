website:
  title: "openEO"
  navbar:
    background: "#1a2744"      # dark navy, exact match
    foreground: "#d0dce8"
    logo: ""
    left:
      - text: "About"
        href: about.qmd
      - text: "Documentation"
        href: docs/index.qmd
      - text: "Software"
        href: software.qmd
