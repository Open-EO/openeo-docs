project:
  type: website

website:
  title: "openEO"
  navbar:
    background: "#1a2744"      # dark navy, exact match
    foreground: "#d0dce8"
    tools:
      - icon: envelope
        href: mailto:openeo.psc@uni-muenster.de
      - icon: linkedin
        href: https://www.linkedin.com/company/openeospec/
        target: _blank
      - icon: bluesky
        href: https://bsky.app/profile/openeo.org
        target: _blank
      - icon: github
        href: https://github.com/Open-EO
        target: _blank
      - icon: youtube
        href: https://www.youtube.com/channel/UCMJQil8j9sHBQkcSlSaEsvQ
        target: _blank
    right: 
      - sidebar:user_documentation
    left:
      - text: "About"
        href: about.qmd
      - text: "Services"
        href: https://hub.openeo.org/
        target: _blank
      - text: "News"
        href: news/news.qmd
      - text: "Meetings"
        href: meetings.qmd
      - text: "Events"
        href: events/events.qmd
      - text: "PSC"
        href: psc.qmd
      - sidebar:support
      
  search: true
  sidebar:
