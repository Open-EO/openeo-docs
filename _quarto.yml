project:
  type: website

website:
  title: "openEO"
  navbar:
    background: "#1a2744"      # dark navy, exact match
    foreground: "#d0dce8"
    tools:
      - icon: envelope
        href: mailto:openeo.psc@uni-muenster.de
      - icon: linkedin
        href: https://www.linkedin.com/company/openeospec/
      - icon: bluesky
        href: https://bsky.app/profile/openeo.org
      - icon: github
        href: https://github.com/Open-EO
      - icon: youtube
        href: https://www.youtube.com/channel/UCMJQil8j9sHBQkcSlSaEsvQ

    left:
      - text: "About"
        href: about.qmd
      - text: "Applications"
        href: https://hub.openeo.org/
      - text: "Services"
        href: 404-not-found.qmd
      - text: "News"
        href: news/news.qmd
      - text: "Meetings"
        href: meetings.qmd
      - text: "Events"
        href: events/events.qmd
      - text: "PSC"
        href: psc.qmd
      - sidebar:support
      
  search: true
  sidebar:
    - id: support 
      title: "Support"
      collapse-level: 1
      contents: 
          - href: Contact.qmd
            text: Contact
          - href: https://forum.dataspace.copernicus.eu/c/openeo/28
